services:
  - type: web
    name: zibsol-mini-app
    runtime: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_PATH
        value: /app/data/zibsol.db
    healthCheckPath: /health
